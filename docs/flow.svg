<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Product-open flow: click lid, 3D swap and unscrew, colour flood and tilt, snapshot hand-off, live jar opens.">
  <title>How the 3D product-open transition works</title>
  <style>
    .card { fill: #fff4e6; stroke: #5a0f2e; stroke-width: 3; }
    .n { font: 900 30px/1 'Impact','Arial Narrow Bold',sans-serif; fill: #ff7a3d; }
    .t { font: 800 17px/1.2 'Helvetica Neue',Arial,sans-serif; fill: #5a0f2e; }
    .s { font: 500 13px/1.3 'Helvetica Neue',Arial,sans-serif; fill: #5a0f2e; opacity: .8; }
    .track { stroke: #5a0f2e; stroke-width: 4; stroke-dasharray: 2 10; stroke-linecap: round; fill: none; opacity: .5; }
    .dot { animation: run 7s cubic-bezier(.6,0,.3,1) infinite; }
    @keyframes run { 0% { transform: translateX(0); } 18% { transform: translateX(0); } 22%,38% { transform: translateX(232px); } 42%,58% { transform: translateX(464px); } 62%,78% { transform: translateX(696px); } 82%,100% { transform: translateX(928px); } }
    .glow { animation: glow 7s infinite; opacity: 0; }
    .g1 { animation-delay: 0s; } .g2 { animation-delay: 1.4s; } .g3 { animation-delay: 2.8s; } .g4 { animation-delay: 4.2s; } .g5 { animation-delay: 5.6s; }
    @keyframes glow { 0%,20% { opacity: 1; } 22%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .glow { opacity: 0; } }
  </style>
  <rect width="1200" height="300" rx="24" fill="#ff9ec4"/>
  <path class="track" d="M136 64 H 1064"/>

  <g>
    <rect class="glow g1" x="24" y="96" width="224" height="180" rx="18" fill="#ffd84d"/>
    <rect class="card" x="32" y="104" width="208" height="164" rx="14"/>
    <text class="n" x="52" y="146">01</text><text class="t" x="52" y="176">Click the lid</text>
    <text class="s" x="52" y="200">Cap scrolls into view,</text><text class="s" x="52" y="218">page prefetches,</text><text class="s" x="52" y="236">WebGL overlay mounts.</text>
  </g>
  <g>
    <rect class="glow g2" x="256" y="96" width="224" height="180" rx="18" fill="#ffd84d"/>
    <rect class="card" x="264" y="104" width="208" height="164" rx="14"/>
    <text class="n" x="284" y="146">02</text><text class="t" x="284" y="176">Swap to 3D</text>
    <text class="s" x="284" y="200">Flat SVG lid becomes</text><text class="s" x="284" y="218">the real Three.js jar</text><text class="s" x="284" y="236">and it unscrews.</text>
  </g>
  <g>
    <rect class="glow g3" x="488" y="96" width="224" height="180" rx="18" fill="#ffd84d"/>
    <rect class="card" x="496" y="104" width="208" height="164" rx="14"/>
    <text class="n" x="516" y="146">03</text><text class="t" x="516" y="176">Flood &amp; tilt</text>
    <text class="s" x="516" y="200">Product colour floods out</text><text class="s" x="516" y="218">while the jar tips to a</text><text class="s" x="516" y="236">3/4 view and sinks.</text>
  </g>
  <g>
    <rect class="glow g4" x="720" y="96" width="224" height="180" rx="18" fill="#ffd84d"/>
    <rect class="card" x="728" y="104" width="208" height="164" rx="14"/>
    <text class="n" x="748" y="146">04</text><text class="t" x="748" y="176">Seamless hand-off</text>
    <text class="s" x="748" y="200">Last frame is passed to</text><text class="s" x="748" y="218">the product page, so the</text><text class="s" x="748" y="236">page swap is invisible.</text>
  </g>
  <g>
    <rect class="glow g5" x="952" y="96" width="224" height="180" rx="18" fill="#ffd84d"/>
    <rect class="card" x="960" y="104" width="208" height="164" rx="14"/>
    <text class="n" x="980" y="146">05</text><text class="t" x="980" y="176">Lid opens</text>
    <text class="s" x="980" y="200">Live jar glides in, spins,</text><text class="s" x="980" y="218">opens to show the cream.</text><text class="s" x="980" y="236">Drag to rotate 360°.</text>
  </g>

  <g class="dot"><circle cx="136" cy="64" r="16" fill="#5a0f2e"/><circle cx="136" cy="64" r="7" fill="#ffd84d"/></g>
</svg>
